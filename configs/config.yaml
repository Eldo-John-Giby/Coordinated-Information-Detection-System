# Coordinated Misinformation Network Detection System
# Configuration file

# ============================================================
# DATA CONFIGURATION
# ============================================================
data:
  # Path to raw dataset directory (downloaded CSVs go here)
  raw_dir: "data/raw"
  # Path to processed dataset output
  processed_dir: "data/processed"
  # Campaign to use (e.g., "Honduras", "UAE", "Armenia", "China_1", "Cuba", or "all")
  # For Zenodo IO dataset: use "Honduras" or "UAE"
  # Run: python -m src.data.convert_zenodo --campaign Honduras
  campaign: "Honduras"
  # Maximum number of files to load per campaign (for memory management)
  max_files_per_campaign: 10
  # Maximum number of posts to load (null = all)
  max_posts: null
  # Fraction of data to use for quick experiments (null = use all)
  subsample_fraction: null
  # Random seed for reproducibility
  random_seed: 42

# ============================================================
# PREPROCESSING CONFIGURATION
# ============================================================
preprocessing:
  # Text normalization
  lowercase: true
  remove_urls_from_text: true
  remove_mentions_from_text: false  # Keep mentions for feature extraction
  min_text_length: 3
  # Missing value handling
  drop_malformed: true
  fill_missing_text: ""
  # Timestamp parsing
  timestamp_format: null  # Auto-detect

# ============================================================
# NLP CONFIGURATION
# ============================================================
nlp:
  # Sentence transformer model
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  # Embedding dimension (384 for all-MiniLM-L6-v2)
  embedding_dim: 384
  # Batch size for embedding computation
  batch_size: 256
  # Device (null = auto-detect)
  device: null

# ============================================================
# SIMILARITY SEARCH CONFIGURATION
# ============================================================
similarity:
  # Method for nearest neighbor search
  method: "faiss"  # "faiss" or "sklearn"
  # Number of nearest neighbors to find (per post, at the post level)
  k_neighbors: 20
  # RECALL-ORIENTED retrieval floor (item 5). Applied only to discard
  # obviously-unrelated post pairs BEFORE cross-encoder reranking; the
  # cross-encoder score is the precision gate. 0.3 because unrelated text
  # rarely exceeds ~0.3 cosine with L2-normalized MiniLM embeddings, while
  # paraphrases stay well above it. Do NOT raise this to a precision filter
  # value - that defeats the retrieve-then-rerank design.
  retrieval_floor: 0.3
  # Cosine similarity threshold for creating edges (bi-encoder-only mode)
  semantic_threshold: 0.7
  # Use FAISS index type (flat, ivf, pq)
  faiss_index_type: "flat"

  # Cross-encoder reranking (retrieve-then-rerank pattern)
  # When true, top-k bi-encoder candidates are re-scored with a cross-encoder
  # for higher precision on paraphrased content
  use_cross_encoder_rerank: true
  # Cross-encoder model: entailment-based or paraphrase-based
  cross_encoder_model: "cross-encoder/nli-deberta-v3-base"
  # Batch size for cross-encoder inference (affects GPU memory / speed)
  cross_encoder_batch_size: 64
  # Cost control (item 6): rerank only the top-N post-pair candidates per
  # pipeline run, ranked by bi-encoder score. Pairs beyond this keep a NaN
  # cross-encoder score and fall back to the bi-encoder score (flagged as
  # lower-confidence). null = rerank every candidate (no cap).
  cross_encoder_rerank_k: null
  # Max post pairs kept per account pair from post-level retrieval (item 4b)
  max_post_pairs_per_account_pair: 3
  # Hard cap on total cross-encoder invocations per run (safety valve for
  # large datasets; most-relevant pairs are reranked first). null = no cap.
  max_rerank_pairs: 20000

# ============================================================
# TEMPORAL CONFIGURATION
# ============================================================
temporal:
  # Time decay parameter (tau) in seconds
  # Posts within tau seconds have high temporal coordination score
  tau: 3600  # 1 hour
  # Burst detection window (seconds)
  burst_window: 300  # 5 minutes
  # Minimum posts in burst window to count as burst
  burst_min_posts: 3

# ============================================================
# COORDINATION EDGE CONFIGURATION
# ============================================================
coordination:
  # Edge creation threshold
  edge_threshold: 0.3
  # Feature weights for coordination score
  weights:
    semantic: 0.35
    temporal: 0.25
    url: 0.15
    hashtag: 0.10
    mention: 0.05
    repost: 0.10
  # Maximum number of edges per node (for scalability)
  max_edges_per_node: 50
  # Minimum coordination score to keep an edge
  min_edge_score: 0.1

# ============================================================
# GRAPH CONFIGURATION
# ============================================================
graph:
  # Whether to use node features
  use_node_features: true
  # Node feature types
  node_features:
    - post_count
    - avg_follower_count
    - avg_following_count
    - repost_ratio
    - avg_hashtag_count
    - avg_url_count
    - avg_mention_count
  # Edge feature types
  edge_features:
    - semantic_similarity
    - temporal_score
    - shared_url_score
    - shared_hashtag_score
    - shared_mention_score
    - repost_score

# ============================================================
# MODEL CONFIGURATION
# ============================================================
models:
  # GCN configuration
  gcn:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.5
    learning_rate: 0.001
    epochs: 100
    patience: 10  # Early stopping patience

  # GraphSAGE configuration
  graphsage:
    hidden_channels: 64
    num_layers: 2
    dropout: 0.5
    learning_rate: 0.001
    epochs: 100
    patience: 10
    aggregator: "mean"  # "mean", "max", "lstm"

  # Baseline ML models
  baseline:
    random_forest:
      n_estimators: 100
      max_depth: 20
      random_state: 42
    logistic_regression:
      max_iter: 1000
      random_state: 42

# ============================================================
# DATA SPLITTING CONFIGURATION
# ============================================================
splitting:
  # Split strategy: "account", "campaign", "temporal"
  strategy: "account"
  # Train/test/val ratios (for account split)
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  # For temporal split: cutoff date (ISO format)
  temporal_cutoff: null

# ============================================================
# EVALUATION CONFIGURATION
# ============================================================
evaluation:
  # Metrics to compute
  classification_metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc
  community_metrics:
    - adjusted_rand_index
    - normalized_mutual_info
  # Cross-validation folds (null = no CV)
  cv_folds: null

# ============================================================
# EXPLAINABILITY CONFIGURATION
# ============================================================
explainability:
  # Methods to use
  methods:
    - "feature_importance"
    - "permutation_importance"
  # Number of permutation runs
  permutation_runs: 10
  # Whether to compute SHAP (requires additional dependencies)
  use_shap: false
  # GNNExplainer over the trained GNN (item 22: implemented via
  # torch_geometric.explain on the GCN model). Adds runtime cost.
  use_gnnexplainer: true

# ============================================================
# VISUALIZATION CONFIGURATION
# ============================================================
visualization:
  # Output directory for figures
  output_dir: "results/figures"
  # Figure format
  format: "png"
  # DPI for saved figures
  dpi: 150
  # Maximum nodes to display in network graph
  max_network_nodes: 200
  # Color scheme
  color_scheme:
    io_account: "#e74c3c"
    control_account: "#2ecc71"
    suspicious_group: "#e67e22"
    background: "#ffffff"

# ============================================================
# EXPERIMENTS CONFIGURATION
# ============================================================
experiments:
  # Run ablation study
  ablation: true
  # Feature ablation categories
  ablation_features:
    - "semantic"
    - "temporal"
    - "url"
    - "hashtag"
    - "mention"
    - "repost"
  # Run cross-campaign evaluation
  cross_campaign: false
  # Output directory for experiment results
  output_dir: "results"

# ============================================================
# PARAPHRASE ROBUSTNESS EXPERIMENT
# ============================================================
paraphrase_experiment:
  # Number of coordinated post pairs to test
  n_pairs: 200
  # Minimum bi-encoder score to include a pair (high-confidence coordination)
  min_biencoder_score: 0.7
  # Anthropic model for paraphrasing
  paraphrase_model: "claude-sonnet-4-6"

# ============================================================
# STREAMLIT CONFIGURATION
# ============================================================
streamlit:
  port: 8501
  theme: "dark"
  max_display_groups: 50
  max_display_accounts: 100


# ============================================================
# PARAPHRASE INJECTION EXPERIMENT (PHASE 2)
# ============================================================
paraphrase_injection:
  # Number of coordinated groups to inject
  K_groups: 30
  # Allowed size range of accounts per group
  group_size_min: 3
  group_size_max: 8
  # Replacement rates p of posts in injected groups replaced with paraphrases
  paraphrase_rates: [0.0, 0.25, 0.50, 0.75, 1.0]
  # Seeds for replication and bootstrap CI
  seeds: [42, 43, 44, 45, 46]
  # Group Louvain size-purity threshold for community recovery
  purity_threshold: 0.5
  # Model for LLM paraphrasing
  llm_model: "claude-sonnet-4-6"
  # Maximum API calls permitted across experiment (safety valve)
  api_limit: 500
  # Cache file path for reproducible, free reruns
  cache_path: "data/cache/paraphrases.jsonl"
  # Prompt templates for the 3 levels of paraphrase
  prompt_templates:
    light: "Paraphrase using contextual synonyms and slight sentence restructuring while preserving exact claims, hashtags, handles, and URLs: {text}"
    heavy: "Completely rewrite with entirely different vocabulary and sentence structure while preserving core meaning, hashtags, handles, and URLs: {text}"
    style_shift: "Rewrite shifting tone to a distinct stylistic register while preserving core meaning, hashtags, handles, and URLs: {text}"

# ============================================================
# ADAPTIVE ADVERSARY EXPERIMENT (PHASE 3)
# ============================================================
adaptive_adversary:
  levels: ["A1", "A2", "A3"]
  max_jitter_hours: 6.0
  seeds: [42, 43, 44, 45, 46]

# ============================================================
# CROSS-CAMPAIGN EXPERIMENT (PHASE 4)
# ============================================================
cross_campaign:
  campaigns: ["Honduras", "UAE"]
  directions:
    - ["Honduras", "UAE"]
    - ["UAE", "Honduras"]
  feature_configurations:
    - "tabular_only"
    - "coordination_graph_only"
    - "gnn_structural_only"
    - "gnn_full"
  randomize_features:
    - "follower_count"
    - "following_count"

# ============================================================
# RIGOR & STATISTICAL ANALYSIS CONFIGURATION (PHASE 5)
# ============================================================
rigor:
  seeds: [42, 43, 44, 45, 46]
  confidence_level: 0.95
  n_bootstraps: 1000
  max_rerank_caps: [5000, 20000, 50000]
  hand_label_sample_size: 50
